name: Claude Automatic PR Review, Tests, and Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review-fix-test:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Review, fix, and test with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          use_sticky_comment: true
          track_progress: true
          show_full_output: true
          claude_args: |
            --permission-mode acceptEdits
            --allowedTools Edit,Write,Bash,Read,Glob,Grep
          prompt: |
            Review this pull request for correctness, regressions, security issues,
            performance problems, maintainability, and test coverage. Read and follow
            repository instructions such as CLAUDE.md if present. Inspect the actual
            diff and relevant surrounding code.

            Fix confirmed defects directly in the current pull-request branch. Add or
            update focused automated tests for changed behavior and every defect you
            fix.

            REQUIRED GATE — CI verify must be green before you finish:
            1. Open `.github/workflows/` and find the primary CI workflow
               (`deploy.yml` if present, otherwise `client.yml` or the workflow that
               runs tests/build before deploy).
            2. Reproduce that workflow's verify/test/build job steps locally
               (install deps, unit tests, production build/lint). Skip remote
               deploy/SSH/SCP/docker-publish steps.
            3. If any verify step fails, fix the code and re-run until green.

            Do not change unrelated code or weaken existing tests. Commit and push
            the code and test changes to the current PR branch. In the final PR
            comment, summarize findings, files changed, tests added, and commands
            run. If a safe fix is not possible, leave precise actionable guidance
            instead of guessing and fail the task so the PR is not merged. Do not
            finish successfully while verify commands are still failing.

  enable-auto-merge:
    needs: review-fix-test
    if: needs.review-fix-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Enable squash auto-merge after required checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge "$PR_URL" --auto --squash
