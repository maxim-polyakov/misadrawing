name: Claude Main Branch Review and Tests

on:
  push:
    branches: [main]

concurrency:
  group: claude-main-review
  cancel-in-progress: true

jobs:
  review-fix-test:
    if: github.actor != 'claude[bot]' && github.event.head_commit != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Review main push, fix issues, and add tests
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            A new push landed on the main branch. Review the commit range
            ${{ github.event.before }}..${{ github.sha }} and the relevant surrounding
            code for correctness, regressions, security issues, performance problems,
            maintainability, and test coverage. Read and follow repository instructions
            such as CLAUDE.md.

            Fix confirmed defects directly on main. Add or update focused automated
            tests for changed behavior and every defect you fix. Run the relevant test,
            lint, and build commands documented by the repository. Do not change
            unrelated code, weaken tests, rewrite history, or edit workflow files.
            If changes are needed, commit and push them to main with a clear message.
            If no changes are needed, leave the repository untouched and summarize the
            checks performed. Never create another commit solely to report results.