name: Claude Main Branch Review and Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      before_sha:
        description: Start commit of the pushed range
        required: true
      head_sha:
        description: End commit of the pushed range
        required: true
      reason:
        description: push_review or verify_failure
        required: false
        default: push_review
      failed_run_id:
        description: Failed Deploy/CI run id when reason=verify_failure
        required: false
        default: ""
      attempt:
        description: Retry attempt number
        required: false
        default: "1"
  workflow_run:
    workflows: ["Deploy", "Client CI/CD"]
    types: [completed]

# Do not cancel an in-progress Claude fix when another event fires.
concurrency:
  group: claude-fix-${{ github.repository }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'push' && github.actor != 'claude[bot]' && github.event.head_commit != null
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue Claude main review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEFAULT_BRANCH="$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq .defaultBranchRef.name)"
          gh workflow run claude-main.yml \
            --repo "${{ github.repository }}" \
            --ref "$DEFAULT_BRANCH" \
            -f before_sha="${{ github.event.before }}" \
            -f head_sha="${{ github.sha }}" \
            -f reason=push_review \
            -f failed_run_id="" \
            -f attempt=1

  requeue-on-verify-failure:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Queue Claude only for verify/build failures
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          FAILED_JOBS="$(gh run view "$RUN_ID" --repo "$REPO" --json jobs \
            --jq '[.jobs[] | select(.conclusion=="failure") | .name] | join(",")')"
          echo "Failed jobs: ${FAILED_JOBS}"

          if ! echo "$FAILED_JOBS" | grep -qiE 'verify|build|test'; then
            echo "Failure is not verify/build/test (likely remote deploy). Skipping Claude."
            exit 0
          fi

          # Stop loops if tip unchanged and Claude already dispatched many times for it.
          TIP="$(gh api "repos/${REPO}/commits/main" --jq .sha)"
          if [ "$TIP" = "$HEAD_SHA" ]; then
            CLAUDE_TRIES="$(gh run list --repo "$REPO" --workflow=claude-main.yml --limit 40 \
              --json event,conclusion,headSha \
              --jq "[.[] | select(.event==\"workflow_dispatch\" and .headSha==\"$HEAD_SHA\")] | length")"
            echo "Claude dispatch runs on this SHA: ${CLAUDE_TRIES}"
            if [ "${CLAUDE_TRIES}" -ge 5 ]; then
              echo "Too many Claude attempts on this tip without a new commit. Stopping."
              exit 0
            fi
          fi

          # Skip if a Claude dispatch is already queued/in progress
          ACTIVE="$(gh run list --repo "$REPO" --workflow=claude-main.yml --limit 10 \
            --json status,event \
            --jq '[.[] | select(.event=="workflow_dispatch" and (.status=="queued" or .status=="in_progress" or .status=="pending"))] | length')"
          if [ "${ACTIVE}" -gt 0 ]; then
            echo "Claude already queued/running. Skipping duplicate requeue."
            exit 0
          fi

          BEFORE="$(gh api "repos/${REPO}/commits/${HEAD_SHA}" --jq '.parents[0].sha // .sha')"
          DEFAULT_BRANCH="$(gh repo view "$REPO" --json defaultBranchRef --jq .defaultBranchRef.name)"

          echo "Re-queue Claude for failed run ${RUN_ID} at ${HEAD_SHA}"
          gh workflow run claude-main.yml \
            --repo "$REPO" \
            --ref "$DEFAULT_BRANCH" \
            -f before_sha="$BEFORE" \
            -f head_sha="$HEAD_SHA" \
            -f reason=verify_failure \
            -f failed_run_id="$RUN_ID" \
            -f attempt=1

  review-fix-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: write
    steps:
      - name: Checkout tip (always latest main if tip moved)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect CI + local verify evidence
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          REASON: ${{ github.event.inputs.reason }}
          FAILED_RUN_ID: ${{ github.event.inputs.failed_run_id }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          set -uo pipefail
          mkdir -p /tmp/claude-ci
          : > /tmp/claude-ci/ci-failed.log
          : > /tmp/claude-ci/local-verify.log

          if [ "$REASON" = "verify_failure" ] && [ -n "$FAILED_RUN_ID" ]; then
            gh run view "$FAILED_RUN_ID" --repo "${{ github.repository }}" --log-failed > /tmp/claude-ci/ci-failed.log 2>&1 || true
          else
            FAIL_ID="$(gh run list --repo "${{ github.repository }}" --branch main --limit 20 \
              --json databaseId,conclusion,headSha,name \
              --jq "[.[] | select(.conclusion==\"failure\" and (.name==\"Deploy\" or .name==\"Client CI/CD\"))][0].databaseId // empty" || true)"
            if [ -n "${FAIL_ID:-}" ]; then
              gh run view "$FAIL_ID" --repo "${{ github.repository }}" --log-failed > /tmp/claude-ci/ci-failed.log 2>&1 || true
            fi
          fi

          run_local_verify() {
            set +e
            if [ -f client/package.json ]; then
              (cd client && npm ci && npm test -- --watchAll=false && npm run build) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if [ -f package.json ]; then
              (npm ci && npm test -- --watchAll=false && npm run build) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if [ -f server/pom.xml ]; then
              (cd server && mvn --batch-mode -DfailIfNoTests=true test) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if [ -f server/mvnw ]; then
              (cd server && chmod +x mvnw && ./mvnw --batch-mode -DfailIfNoTests=true test) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if [ -f server/requirements.txt ] || [ -f server/requirements-test.txt ]; then
              REQ=server/requirements-test.txt
              [ -f "$REQ" ] || REQ=server/requirements.txt
              (python -m pip install -r "$REQ" && cd server && python -m unittest discover -s tests -v) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if [ -f requirements.txt ]; then
              (python -m pip install -r requirements.txt && python -m unittest discover -s tests -v) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            if ls server/*.sln >/dev/null 2>&1; then
              (dotnet test server/*.sln --configuration Release) >> /tmp/claude-ci/local-verify.log 2>&1
              return $?
            fi
            echo "No known verify commands detected" >> /tmp/claude-ci/local-verify.log
            return 0
          }

          run_local_verify
          echo "local_exit=$?" >> "$GITHUB_OUTPUT"
          echo "Local verify log bytes: $(wc -c < /tmp/claude-ci/local-verify.log | tr -d ' ')"
          echo "CI failed log bytes: $(wc -c < /tmp/claude-ci/ci-failed.log | tr -d ' ')"

      - name: Build Claude prompt with embedded errors
        id: prompt
        uses: actions/github-script@v7
        env:
          BEFORE_SHA: ${{ github.event.inputs.before_sha }}
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
          REASON: ${{ github.event.inputs.reason }}
          FAILED_RUN_ID: ${{ github.event.inputs.failed_run_id }}
          ATTEMPT: ${{ github.event.inputs.attempt }}
          LOCAL_EXIT: ${{ steps.evidence.outputs.local_exit }}
        with:
          script: |
            const fs = require('fs');
            const local = fs.existsSync('/tmp/claude-ci/local-verify.log')
              ? fs.readFileSync('/tmp/claude-ci/local-verify.log', 'utf8').slice(-24000)
              : '';
            const ci = fs.existsSync('/tmp/claude-ci/ci-failed.log')
              ? fs.readFileSync('/tmp/claude-ci/ci-failed.log', 'utf8').slice(-16000)
              : '';
            const prompt = [
              `Reason: ${process.env.REASON}`,
              `Attempt: ${process.env.ATTEMPT}`,
              `Commit range: ${process.env.BEFORE_SHA}..${process.env.HEAD_SHA}`,
              `Failed run id: ${process.env.FAILED_RUN_ID}`,
              `Local verify exit code BEFORE you start: ${process.env.LOCAL_EXIT}`,
              '',
              'You own the WHOLE repository tip on main, not just the commit-range diff.',
              'Work exactly like a developer fixing a red CI build:',
              '1) Read the LOCAL VERIFY OUTPUT below (path + line + error).',
              '2) Open that file and fix the reported error.',
              '3) Re-run the same verify commands until they pass.',
              '4) Commit and push to main.',
              'Your ONLY success condition: local verify is green AND fixes are pushed if anything was broken.',
              'Do not stop after reading code. Do not claim success while verify is red.',
              '',
              '=== LOCAL VERIFY OUTPUT (authoritative — fix these errors) ===',
              local || '(empty)',
              '=== END LOCAL VERIFY OUTPUT ===',
              '',
              '=== CI FAILED LOG EXCERPT ===',
              ci || '(empty)',
              '=== END CI FAILED LOG ===',
              '',
              'Reproduce verify with the same commands as deploy.yml / client.yml verify jobs',
              '(skip remote deploy/SSH). Typical client: cd client && npm ci && npm test -- --watchAll=false && npm run build',
              'Fix application code anywhere in the repo based on the log (missing imports, eslint no-undef, tests, etc).',
              'Re-run verify until green, then commit and push to main.',
              'Do not edit workflow files. Do not weaken tests. Never create a commit only to report results.',
            ].join('\n');
            core.setOutput('text', prompt);

      - name: Review / fix with Claude
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: "*"
          show_full_output: true
          prompt: ${{ steps.prompt.outputs.text }}

      - name: Hard verify gate after Claude
        id: verify
        run: |
          set -euo pipefail
          : > /tmp/claude-ci/post-verify.log
          echo "Running hard verify gate..."

          if [ -f client/package.json ]; then
            (cd client && npm ci && npm test -- --watchAll=false && npm run build) 2>&1 | tee /tmp/claude-ci/post-verify.log
          elif [ -f package.json ]; then
            (npm ci && npm test -- --watchAll=false && npm run build) 2>&1 | tee /tmp/claude-ci/post-verify.log
          fi

          if [ -f server/pom.xml ]; then
            (cd server && mvn --batch-mode -DfailIfNoTests=true test) 2>&1 | tee -a /tmp/claude-ci/post-verify.log
          elif [ -f server/mvnw ]; then
            (cd server && chmod +x mvnw && ./mvnw --batch-mode -DfailIfNoTests=true test) 2>&1 | tee -a /tmp/claude-ci/post-verify.log
          fi

          if [ -f server/requirements.txt ] || [ -f server/requirements-test.txt ]; then
            REQ=server/requirements-test.txt
            [ -f "$REQ" ] || REQ=server/requirements.txt
            python -m pip install -r "$REQ"
            if [ -d server/tests ]; then
              (cd server && python -m unittest discover -s tests -v) 2>&1 | tee -a /tmp/claude-ci/post-verify.log
            fi
          fi

          if [ -f requirements.txt ] && [ ! -f client/package.json ]; then
            python -m pip install -r requirements.txt
            if [ -d tests ]; then python -m unittest discover -s tests -v 2>&1 | tee -a /tmp/claude-ci/post-verify.log; fi
          fi

          if ls server/*.sln >/dev/null 2>&1; then
            dotnet test server/*.sln --configuration Release 2>&1 | tee -a /tmp/claude-ci/post-verify.log
          fi

          echo "Hard verify gate passed"

      - name: Restart CI/Deploy only after green verify
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq .defaultBranchRef.name)"
          git fetch origin "$DEFAULT_BRANCH"

          WF=""
          if gh workflow list --repo "${{ github.repository }}" --json path --jq '.[].path' | grep -q 'deploy.yml'; then
            WF="deploy.yml"
          elif gh workflow list --repo "${{ github.repository }}" --json path --jq '.[].path' | grep -q 'client.yml'; then
            WF="client.yml"
          else
            echo "No deploy.yml/client.yml found; skipping restart"
            exit 0
          fi

          echo "Restarting ${WF} on ${DEFAULT_BRANCH}"
          gh workflow run "$WF" --repo "${{ github.repository }}" --ref "$DEFAULT_BRANCH"

      - name: Requeue Claude if verify still red
        if: failure() && steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ github.event.inputs.attempt }}
        run: |
          set -euo pipefail
          NEXT=$(( ${ATTEMPT:-1} + 1 ))
          if [ "$NEXT" -gt 3 ]; then
            echo "Claude failed verify gate 3 times. Stopping requeue."
            exit 1
          fi

          DEFAULT_BRANCH="$(gh repo view "${{ github.repository }}" --json defaultBranchRef --jq .defaultBranchRef.name)"
          git fetch origin "$DEFAULT_BRANCH"
          HEAD="$(git rev-parse "origin/${DEFAULT_BRANCH}")"
          BEFORE="$(gh api "repos/${{ github.repository }}/commits/${HEAD}" --jq '.parents[0].sha // .sha')"

          echo "Requeue Claude attempt ${NEXT} for ${HEAD}"
          gh workflow run claude-main.yml \
            --repo "${{ github.repository }}" \
            --ref "$DEFAULT_BRANCH" \
            -f before_sha="$BEFORE" \
            -f head_sha="$HEAD" \
            -f reason=verify_failure \
            -f failed_run_id="${{ github.event.inputs.failed_run_id }}" \
            -f attempt="$NEXT"
          exit 1
