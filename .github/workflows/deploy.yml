name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Check server
        working-directory: server
        run: |
          npm ci
          npm test
          node --check index.js

      - name: Check client
        working-directory: client
        env:
          CI: "true"
        run: |
          npm ci
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment files
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV }}
          CLIENT_ENV: ${{ secrets.CLIENT_ENV }}
        run: |
          printf '%s\n' "$SERVER_ENV" > server/.env
          printf '%s\n' "$CLIENT_ENV" > client/.env

      - name: Copy project to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "client,server,scripts,docker-compose.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Build project on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          COMPOSE_K3S_REGISTRY_PREFIX: ghcr.io/${{ github.repository }}
          COMPOSE_K3S_REGISTRY_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: DEPLOY_PATH,GHCR_TOKEN,GHCR_USERNAME,COMPOSE_K3S_REGISTRY_PREFIX,COMPOSE_K3S_REGISTRY_TAG
          script_stop: true
          command_timeout: 60m
          script: |
            set -euo pipefail
            echo "[deploy] $(date -Is) connected on $(hostname)"
            cd "$DEPLOY_PATH"
            export DOCKER_CONFIG
            DOCKER_CONFIG="$(mktemp -d)"
            trap 'rm -rf "$DOCKER_CONFIG"' EXIT
            printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USERNAME" --password-stdin
            export COMPOSE_BAKE=0
            export BUILDX_NO_DEFAULT_ATTESTATIONS=1
            export TMPDIR=/tmp
            export COMPOSE_K3S_LOCK_WAIT="${COMPOSE_K3S_LOCK_WAIT:-300}"
            export COMPOSE_K3S_CLEAR_ORPHAN_LOCK=1
            stdbuf -oL -eL bash "$DEPLOY_PATH/scripts/compose-k3s-sync.sh" \
              --project-dir "$DEPLOY_PATH" \
              --env-file client/.env
